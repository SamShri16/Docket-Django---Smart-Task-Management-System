{% extends 'base.html' %}
{% block title %}Delete Task{% endblock %}

{% block content %}

<div class="card" style="max-width: 450px; margin: 40px auto; text-align: center;">
    <h2 style="margin-bottom: 10px;">🗑️ Delete Task?</h2>
    <p style="color: #6b7280; margin-bottom: 25px;">
        Are you sure you want to delete <strong>"{{ task.title }}"</strong>?
        <br>This action cannot be undone.
    </p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'task_list' %}" class="btn btn-secondary" style="margin-left: 10px;">Cancel</a>
    </form>
</div>

{% endblock %}
