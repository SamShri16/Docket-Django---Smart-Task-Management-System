{% extends 'base.html' %}
{% block title %}Delete Category{% endblock %}

{% block content %}

<div class="card" style="max-width: 420px; margin: 40px auto; text-align: center;">
    <h2 style="margin-bottom: 10px;">🗑️ Delete Category?</h2>
    <p style="color: #6b7280; margin-bottom: 25px;">
        Delete <strong>"{{ category.name }}"</strong>?
        <br>Tasks in this category won't be deleted.
    </p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, Delete</button>
        <a href="{% url 'category_list' %}" class="btn btn-secondary" style="margin-left:10px;">Cancel</a>
    </form>
</div>

{% endblock %}
