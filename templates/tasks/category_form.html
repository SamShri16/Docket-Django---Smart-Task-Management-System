{% extends 'base.html' %}
{% block title %}Add Category{% endblock %}

{% block content %}

<div class="page-heading">
    <h2>Add Category</h2>
    <a href="{% url 'category_list' %}" class="btn btn-secondary">← Back</a>
</div>

<div class="card" style="max-width: 400px;">
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="form-group">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}<div class="form-error">{{ field.errors.0 }}</div>{% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary">Save Category</button>
        <a href="{% url 'category_list' %}" class="btn btn-secondary" style="margin-left:10px;">Cancel</a>
    </form>
</div>

{% endblock %}
